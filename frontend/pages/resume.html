<section class="section resume">
  <div class="resume-bar glass scanlines">
    <div class="resume-id">
      <span class="resume-tag kbd">PDF</span>
      <span class="resume-title">resume</span>
      <span class="resume-sub">sid k — doc viewer</span>
    </div>

    <div class="resume-actions">
      <a class="resume-btn" href="/resume.pdf" target="_blank" rel="noopener" title="Open the raw PDF">
        open
      </a>
      <a class="resume-btn resume-dl" href="/resume.pdf" download="sidk-resume.pdf" title="Download the PDF">
        ↓ download
      </a>
    </div>
  </div>

  <div class="resume-frame glass scanlines">
    <iframe
      class="resume-doc"
      src="/resume.pdf#toolbar=0&navpanes=0&statusbar=0&view=FitH"
      title="Resume document"
      loading="lazy"
    ></iframe>

    <noscript>
      <p class="resume-fallback">Your browser can't embed PDFs —
        <a href="/resume.pdf">open it directly</a>.</p>
    </noscript>
  </div>

  <p class="resume-hint">
    Can't see it? <a href="/resume.pdf" target="_blank" rel="noopener">open the PDF in a new tab</a>.
  </p>
</section>
